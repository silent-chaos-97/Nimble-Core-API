collection: Departments
element: Department
group: organization
kind: custom
order: 0
columns:

  - data: id
    readOnly: true
    title: ID
    allowEmpty: false

  - data: name
    slugify: id
    allowEmpty: false

  - data: product
    type: key-value-setting
    multiple: true
    selectSettings:
      ref: products
      value: category
      title: category

  - data: meeting_frequency
    type: dropdown
    source: 
      - daily 
      - weekdays
      - weekends
      - weekly on monday
      - weekly on tuesday
      - weekly on wednesday
      - weekly on thursday
      - weekly on friday
      - weekly on saturday
      - weekly on sunday
      - monthly on the 1st
      - monthly on the 2nd
      - monthly on the 3rd
      - monthly on the 4th
      - monthly on the 5th
      - monthly on the 6th
      - monthly on the 7th
      - monthly on the 8th
