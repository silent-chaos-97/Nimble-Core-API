collection: Departments
element: Department
group: organization
kind: custom
order: 0
columns:

  - data: id
    readOnly: true
    title: ID
    allowEmpty: false

  - data: name
    slugify: id
    allowEmpty: false

  - data: product
    type: key-value-setting
    multiple: true
    selectSettings:
      ref: products
      value: category
      title: category

  - data: meeting_frequency
    type: dropdown
    source: 
      - daily 
      - weekdays
      - weekly on monday
      - weekly on tuesday
      - weekly on wednesday
      - weekly on thursday
      - weekly on friday
      - weekly on saturday
      - weekly on sunday
      - monthly on the 1st
      - monthly on the 2nd
      - monthly on the 3rd
      - monthly on the 4th
      - monthly on the 5th
      - monthly on the 6th
      - monthly on the 7th
      - monthly on the 8th
      - monthly on the 9th
      - monthly on the 10th
      - monthly on the 11th
      - monthly on the 12th
      - monthly on the 13th
      - monthly on the 14th
      - monthly on the 15th
      - monthly on the 16th
      - monthly on the 17th
      - monthly on the 18th
      - monthly on the 19th
      - monthly on the 20th
      - monthly on the 21st
      - monthly on the 22nd
      - monthly on the 23rd
      - monthly on the 24th
      - monthly on the 25th
      - monthly on the 26th
      - monthly on the 27th
      - monthly on the 28th
      - monthly on the 29th
      - monthly on the 30th
      - monthly on the last day

  - data: time_zone
    type: dropdown
    source:
      - Eastern
      - Central
      - Mountain
      - Pacific

  - data: no_DST
    type: checkbox
    checkedTemplate: NO DST
    uncheckedTemplate: DST
