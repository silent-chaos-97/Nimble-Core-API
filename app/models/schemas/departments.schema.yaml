collection: Departments
element: Department
group: organization
kind: custom
order: 0
columns:

  - data: id
    readOnly: true
    title: ID
    allowEmpty: false

  - data: name
    slugify: id
    allowEmpty: false

  - data: product
    type: key-value-setting
    multiple: true
    selectSettings:
      ref: products
      value: category
      title: category

  - data: meeting_frequency
    type: dropdown
    source: 
      - daily 
      - weekdays
      - weekends
      - weekly on monday
      - weekly on tuesday
      - weekly on wednesday
      - weekly on thursday
      - weekly on friday
