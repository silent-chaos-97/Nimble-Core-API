collection: Committees
element: Committee
group: organization
kind: custom
order: 0

columns:
  - data: id
    readOnly: true
    title: ID
    allowEmpty: false

  - data: name
    slugify: id
    allowEmpty: false

  - data: product
    type: key-value-setting
    multiple: true
    selectSettings:
      ref: products
      value: category
      title: category

  - data: meeting_frequency

  - data: meeting_time
    type: time
    timeFormat: h:mm a
    correctFormat: true
