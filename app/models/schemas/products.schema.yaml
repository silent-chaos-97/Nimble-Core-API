collection: Products
element: Product
group: products
kind: custom
order: 0

columns:
  - data: id
    title: ID
    readOnly: true
    width: '50'
    allowEmpty: false

  - data: code
    allowEmpty: false
    slugify: id

  - data: name
    allowEmpty: false

  - data: category
    type: dropdown
    source: ['card', 'deposit', 'loan']
    correctFormat: true

  - data: subcategory
    type: dropdown
    parent: category
    source:
      Card: ['Credit', 'Debit', 'Hybrid']
      Deposit: ['Checking', 'Savings', 'Certificate of Deposit']
      Loan: ['Term', 'LOC']
    correctFormat: true

  - data: advanced_rate
    title: Collateral Type
    type: key-value-setting
    selectSettings:
      ref: advanced_rates
      value: id
      title: asset_type

  - data: scope
    title: Account Type
    type: key-value-setting
    selectSettings:
      ref: scopes
      value: id
      title: name

  - data: minimum_amount
    type: integer
    numericFormat:
      pattern: $0,0
      culture: en-US
      prefix: $

  - data: maximum_amount
    type: integer
    numericFormat:
      pattern: $0,0
      culture: en-US
      prefix: $

  - data: base_rate
    Title: Base Rate
    editor: select
    width: 500
    internalValue: interest-rates/type/rate/%/0.0
    selectOptions:
