collection: Products
element: Product
group: products
kind: custom
order: 0

columns:
  - data: id
    title: ID
    readOnly: true
    width: '50'
    allowEmpty: false

  - data: code
    allowEmpty: false
    slugify: id

  - data: name
    allowEmpty: false

  - data: category
    type: dropdown
    source: ['card', 'deposit', 'loan']
    correctFormat: true

  - data: subcategory
    type: dropdown
    parent: category
    source:
      Card: ['Credit', 'Debit', 'Hybrid']
      Deposit: ['Checking', 'Savings', 'Certificate of Deposit']
      Loan: ['Term', 'LOC']
    correctFormat: true

  - data: advanced_rate
    title: Collateral Type
    type: key-value-setting
    selectSettings:
      ref: advanced_rates
      value: id
      title: asset_type

  - data: scope
    title: Account Type
    type: key-value-setting
    selectSettings:
      ref: scopes
      value: id
      title: name

  - data: minimum_amount
    type: integer
    numericFormat:
      pattern: $0,0
      culture: en-US
      prefix: $

  - data: maximum_amount
    type: integer
    numericFormat:
      pattern: $0,0
      culture: en-US
      prefix: $

  - data: base_rate
    Title: Base Rate
    editor: select
    width: 500
    internalValue: interest-rates/type/rate/%/0.0
    selectOptions:
      'INTERNAL_RATE': Internal Rate
      'RIFSPBLP_N.B': Bank Prime Rate / Average Majority / Short-Term Loan
      'RIFSRP_F02_N.B': Discount Window Primary Credit
      'RIFSPFF_N.B': Federal Funds Effective Rate
      'RIFSPPNAAD30_N.B': Commercial Paper / Nonfinancial / 30-Day
      'RIFSPPNAAD60_N.B': Commercial Paper / Nonfinancial / 60-Day
      'RIFSPPNAAD90_N.B': Commercial Paper / Nonfinancial / 90-Day
      'RIFSPPFAAD30_N.B': Commercial Paper / Financial / 30-Day
      'RIFSPPFAAD60_N.B': Commercial Paper / Financial / 60-Day
      'RIFSPPFAAD90_N.B': Commercial Paper / Financial / 90-Day
      'RIFSGFSW04_N.B': Treasury Bills / Secondary Market / 4-week
      'RIFSGFSM03_N.B': Treasury Bills / Secondary Market / 3-Month
      'RIFSGFSM06_N.B': Treasury Bills / Secondary Market / 6-Month
      'RIFSGFSY01_N.B': Treasury Bills / Secondary Market / 1-Year
      'RIFLGFCM01_N.B': Treasury / Constant Maturities / 1-Month
      'RIFLGFCM03_N.B': Treasury / Constant Maturities / 3-Month
      'RIFLGFCM06_N.B': Treasury / Constant Maturities / 6-Month
      'RIFLGFCY01_N.B': Treasury / Constant Maturities / 1-Year
      'RIFLGFCY02_N.B': Treasury / Constant Maturities / 2-Year
      'RIFLGFCY03_N.B': Treasury / Constant Maturities / 3-Year
      'RIFLGFCY05_N.B': Treasury / Constant Maturities / 5-Year
      'RIFLGFCY07_N.B': Treasury / Constant Maturities / 7-Year
      'RIFLGFCY10_N.B': Treasury / Constant Maturities / 10-Year
      'RIFLGFCY20_N.B': Treasury / Constant Maturities / 20-Year
      'RIFLGFCY30_N.B': Treasury / Constant Maturities / 30-Year
      'RIFLGFCY05_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 5-Year
      'RIFLGFCY07_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 7-Year
      'RIFLGFCY10_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 10-Year
      'RIFLGFCY20_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 20-Year
      'RIFLGFCY30_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 30-Year
      'RIFLGFL_XII_N.B': Treasury / Inflation Indexed / Long-Term Averge (over 10 years)

  - data: rate_consideration
    title: Rate Consideration (bps)
    type: numeric
    width: 130
    numericFormat:
      pattern: 0.00
      postfix: '%'
    allowEmpty: false

  - data: effective_rate
    type: numeric
    width: 130
    readOnly: true
    formula: Number(x.base_rate_internal_value + x.rate_consideration || 0)
    numericFormat:
      pattern: 0.00%
      postfix: '%'

  - data: rate_type
    editor: select
    selectOptions:
      variable: Variable
      fixed: Fixed

  - data: update_frequency
    editor: select
    selectOptions:
      hourly: Hourly
      daily: Daily
      weekly: Weekly
      montly: Monthly
  
  - data: reprice_base_rate
    Title: Reprice Base Rate
    editor: select
    width: 500
    internalValue: interest-rates/type/rate/%/0.0
    selectOptions:
      'RIFSPBLP_N.B': Bank Prime Rate / Average Majority / Short-Term Loan
      'RIFSRP_F02_N.B': Discount Window Primary Credit
      'RIFSPFF_N.B': Federal Funds Effective Rate
      'RIFSPPNAAD30_N.B': Commercial Paper / Nonfinancial / 30-Day
      'RIFSPPNAAD60_N.B': Commercial Paper / Nonfinancial / 60-Day
      'RIFSPPNAAD90_N.B': Commercial Paper / Nonfinancial / 90-Day
      'RIFSPPFAAD30_N.B': Commercial Paper / Financial / 30-Day
      'RIFSPPFAAD60_N.B': Commercial Paper / Financial / 60-Day
      'RIFSPPFAAD90_N.B': Commercial Paper / Financial / 90-Day
      'RIFSGFSW04_N.B': Treasury Bills / Secondary Market / 4-week
      'RIFSGFSM03_N.B': Treasury Bills / Secondary Market / 3-Month
      'RIFSGFSM06_N.B': Treasury Bills / Secondary Market / 6-Month
      'RIFSGFSY01_N.B': Treasury Bills / Secondary Market / 1-Year
      'RIFLGFCM01_N.B': Treasury / Constant Maturities / 1-Month
      'RIFLGFCM03_N.B': Treasury / Constant Maturities / 3-Month
      'RIFLGFCM06_N.B': Treasury / Constant Maturities / 6-Month
      'RIFLGFCY01_N.B': Treasury / Constant Maturities / 1-Year
      'RIFLGFCY02_N.B': Treasury / Constant Maturities / 2-Year
      'RIFLGFCY03_N.B': Treasury / Constant Maturities / 3-Year
      'RIFLGFCY05_N.B': Treasury / Constant Maturities / 5-Year
      'RIFLGFCY07_N.B': Treasury / Constant Maturities / 7-Year
      'RIFLGFCY10_N.B': Treasury / Constant Maturities / 10-Year
      'RIFLGFCY20_N.B': Treasury / Constant Maturities / 20-Year
      'RIFLGFCY30_N.B': Treasury / Constant Maturities / 30-Year
      'RIFLGFCY05_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 5-Year
      'RIFLGFCY07_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 7-Year
      'RIFLGFCY10_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 10-Year
      'RIFLGFCY20_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 20-Year
      'RIFLGFCY30_XII_N.B': Treasury / Constant Maturities / Inflation Indexed / 30-Year
      'RIFLGFL_XII_N.B': Treasury / Inflation Indexed / Long-Term Averge (over 10 years)

