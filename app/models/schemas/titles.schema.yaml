collection: Titles
element: Title
group: organization
kind: custom
order: 0

columns:
  - data: id
    readOnly: true
    title: ID
    allowEmpty: false

  - data: name
    title: Title
    slugify: id
    allowEmpty: false

  - data: department
    title: Department
    type: key-value-setting
    multiple: true
    selectSettings:
      ref: departments
      value: id
      title: name
  - data: workgroup
    title: Committee
    multiple: true
    type: key-value-setting
