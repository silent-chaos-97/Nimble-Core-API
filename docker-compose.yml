version: '2.1'

services:
  db:
    image: postgres:11-alpine
    container_name: nimble-core-db.db
    volumes:
      - ./.pgdata/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: nimble-core-pass
      POSTGRES_USER: nimble-core-user
      POSTGRES_DB: nimble-core-db
