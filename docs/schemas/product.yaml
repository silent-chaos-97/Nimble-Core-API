Product:
  type: object
  required:
    - id
    - name
    - category
    - summary
    - content
  properties:
    id:
      type: string
      format: uuidv4
      title: Id
      readOnly: true
      example: 7fcf53da-6b67-4fa5-aa7e-4328f24f8ade
    name:
      type: string
      title: Name
      description: The name of the product
