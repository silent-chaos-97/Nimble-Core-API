Product:
  type: object
  required:
    - id
    - name
    - category
    - summary
    - content
  properties:
    id:
      type: string
      format: uuidv4
      title: Id
      description: The unique identifier of the product
      readOnly: true
    name:
      type: string
      title: Name
      description: The name of the product
      example: Simple Checking
    category:
      type: string
      title: Category
      description: The category of the product
      enum: ['CHECKING', 'SAVINGS', 'CD']
      example: CHECKING
    options:
      type: array
      title: Options
      readOnly: true
      items:
        $ref: '#/components/schemas/ProductOption'
    summary:
      type: string
      title: Summary
      description: The summary of the product
