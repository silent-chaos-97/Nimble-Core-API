SignerIdentityVerification:
  type: object
  required:
    - verification
    - category
    - date
    - status
  properties:
    verification:
      title: The name of the verification type
      type: string
    category:
      title: The type of verification
      type: string
    date:
      type: string
      format: date-time
    status:
      title: The status of the verification
      type: string
