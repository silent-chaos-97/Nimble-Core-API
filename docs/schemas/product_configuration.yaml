ProductConfiguration:
  type: object
  required:
    - productId
  properties:
    productId:
      type: string
      format: uuidv4
      title: Product
      description: The unique identifier of the product
      example: 95554751-51d1-4f37-9785-417ae5251d56
    initialDeposit:
      type: number
      title: Initial Opening Deposit Amount
