Document:
  type: object
  required:
    - id
    - content
    - format
    - createdAt
  properties:
    id:
      type: string
      format: uuidv4
      title: Document unique id
      readOnly: true
      example: a74f9092-5889-430a-9c19-6712f9f68090
    institutionId:
      type: string
      format: uuidv4
      title: Uploading document on behalf of this Institution
      writeOnly: true
      description: institution identifier
      example: a74f9092-5889-430a-9c19-6712f9f68090
    content:
      type: string
      format: byte
