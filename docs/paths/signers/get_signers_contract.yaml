/signers/{id}/contract:
  get:
    tags:
      - Signer
    description: Fetch Signer Contract
    operationId: getSignerContract
    security:
      - bearer: ['signers']
    parameters:
      - name: id
        in: path
        description: Signer id
        required: true
        schema:
          type: string
          format: uuidv4
