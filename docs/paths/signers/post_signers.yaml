/signers:
  post:
    tags:
      - Signer
    summary: Create Signer
    description: Create Signer
    security:
      - bearer: ['account_requests']
    requestBody:
      description: Signer information
      required: true
      content:
        application/json:
            allOf:
              - $ref: '#/components/schemas/Signer'
              - type: object
                required:
                  - role
                  - email
              - properties:
                  accountRequestId:
                    type: string
                    writeOnly: true
                    format: uuidv4
