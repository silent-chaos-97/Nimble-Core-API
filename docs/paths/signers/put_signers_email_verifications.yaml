/signers/{id}/email-verifications/{verificationId}:
  put:
    tags:
      - Signer
    summary: Consume a Signer Email Verification
    parameters:
      - in: path
        name: id
        description: uuid signer id
        required: true
        schema:
          type: string
          format: uuidv4
      - in: path
        name: verificationId
        description: signer email verification id
        required: true
        schema:
          type: string
          format: uuidv4
    security:
      - bearer: []
    responses:
      '204':
