/signers/{id}/email-verifications:
  post:
    tags:
      - Signer
    summary: Create a Signer Email Verification
    description: Used to send the email verification link to a signer
    parameters:
      - in: path
        name: id
        description: uuid signer id
        schema:
          type: string
          format: uuidv4
      - name: token
        in: path
