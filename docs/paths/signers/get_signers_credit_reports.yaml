/signers/{id}/credit-reports:
  get:
    tags:
      - Signer
    summary: Get Signer credit reports by Id
    parameters:
      - in: path
        name: id
        description: uuid signer id
        required: true
        schema:
          type: string
          format: uuidv4
      - name: limit
        in: query
        required: false
        description: Limit number of records
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Offset for paginating records
        schema:
          type: integer
