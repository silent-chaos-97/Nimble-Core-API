/signers/{id}/validate:
  post:
    tags:
      - Signer
    summary: Validate Signer
    description: Validate Signer
    parameters:
      - in: path
        name: id
        description: uuid Signer Id
        required: true
        schema:
          format: uuidv4
    security:
      - bearer: []
    requestBody:
      description: Signer information
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Signer'
              - type: object
                required:
                  - accountRequestId
              - properties:
                  id:
                    type: string
