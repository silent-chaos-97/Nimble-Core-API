/signers/{id}/validate:
  post:
    tags:
      - Signer
    summary: Validate Signer
    description: Validate Signer
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuidv4
    security:
      - bearer: []
    requestBody:
      description: Signer information
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Signer'
